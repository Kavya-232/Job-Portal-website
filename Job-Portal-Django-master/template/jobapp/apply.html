{% extends 'base.html' %}

{% block apply %}
<!-- Apply Job Form -->
<div class="container my-5">
  {% include 'messages.html' %}
  <h2 class="text-center mb-4">Job Application Form</h2>
  
  <form action="{% url 'jobapp:apply_job' job.id %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label for="full_name" class="form-label">Full Name:</label>
      <input type="text" id="full_name" name="full_name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email Address:</label>
      <input type="email" id="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number:</label>
      <input type="text" id="phone" name="phone" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="state" class="form-label">State:</label>
      <input type="text" id="state" name="state" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="city" class="form-label">City:</label>
      <input type="text" id="city" name="city" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="resume" class="form-label">Upload Resume:</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="cover_letter" class="form-label">Cover Letter:</label>
      <textarea id="cover_letter" name="cover_letter" class="form-control" rows="4" required></textarea>
    </div>

    <div class="mb-3">
      <label for="experience" class="form-label">Years of Experience:</label>
      <input type="number" id="experience" name="experience" min="0" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="linkedin" class="form-label">LinkedIn Profile:</label>
      <input type="url" id="linkedin" name="linkedin" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-10 float-end">Apply Now</button>
  </form>
</div>

{% endblock apply %}
